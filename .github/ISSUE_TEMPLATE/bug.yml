name: Bug report
description: Report reproducible incorrect behavior in Omarchy Forge
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; use private security reporting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: forge-version
    attributes:
      label: Forge version
      description: Paste the first line of `omaforge version`.
    validations:
      required: true
  - type: input
    id: omarchy-version
    attributes:
      label: Omarchy version
      description: Include the package version if the issue involves Omarchy compatibility.
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Include relevant architecture and tool versions, with secrets and personal paths removed.
